<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta http-equiv="refresh" content="0; url=https://lta-ascend-team.azurewebsites.net/pilot">
  <title>Ascend · Microsoft team sign-in</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #25213b; background: #f8f6ff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { box-sizing: border-box; width: min(100%, 520px); padding: 36px; background: #fff; border: 1px solid #e6e0f5; border-radius: 24px; box-shadow: 0 16px 60px #3522660d; }
    .brand { margin: 0 0 24px; color: #7651c6; font-weight: 750; font-size: 18px; letter-spacing: .12em; }
    h1 { margin: 0 0 16px; font-size: clamp(27px, 5vw, 36px); line-height: 1.15; letter-spacing: -.035em; }
    p { line-height: 1.6; }
    .button { display: inline-block; margin: 12px 0; padding: 14px 20px; background: #6842b5; border-radius: 12px; color: #fff; font-weight: 650; text-decoration: none; }
    .button:focus-visible { outline: 3px solid #c39214; outline-offset: 4px; }
    .note { margin-bottom: 0; color: #696277; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">ASCEND</p>
    <h1>Opening your team demo.</h1>
    <p>Continue to Ascend and sign in with your invited Microsoft school account.</p>
    <a class="button" href="https://lta-ascend-team.azurewebsites.net/pilot" rel="noreferrer">Open Ascend</a>
    <p class="note">The team demo uses fictional school data. If this page stays open, use the button above.</p>
  </main>
</body>
</html>
